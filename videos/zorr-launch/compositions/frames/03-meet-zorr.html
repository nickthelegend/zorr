<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 3 — Meet Zorr · blueprint: cursor-ui-demo (Adapt: guide = slow camera push, no cursor chrome)
         Everything the runtime needs lives INSIDE <template>. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Audiowide";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Audiowide-Regular.ttf") format("truetype");
        }
        @font-face {
          font-family: "Space Mono";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/SpaceMono-Regular.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Space Mono", monospace;
        }

        /* Full-bleed ground — a dedicated clip on the lowest track, never on #root */
        .mz3-bg {
          position: absolute;
          inset: 0;
          background: #05050b;
        }

        .mz3-stage {
          position: absolute;
          inset: 0;
        }

        /* ── depth layer 2: compass geo-ring (solid + dashed inner), behind the phone ── */
        .mz3-ring {
          position: absolute;
          left: 921px;
          top: 30px;
          width: 845px;
          height: 845px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          z-index: 1;
        }
        .mz3-ring::before {
          content: "";
          position: absolute;
          inset: 10%;
          border: 1px dashed rgba(255, 255, 255, 0.1);
          border-radius: 50%;
        }

        /* ── depth layer 3: phone-framed hero (1px hairline device frame, 0 radius) ── */
        .mz3-phone {
          position: absolute;
          left: 1135px;
          top: 44px;
          width: 418px;
          height: 818px;
          box-sizing: border-box;
          padding: 8px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background: #0a0a0f;
          z-index: 2;
          will-change: transform, opacity;
        }
        .mz3-screen {
          position: relative;
          width: 400px;
          height: 800px;
          overflow: hidden;
          background: #05050b;
        }
        /* coordinate-target-zoom: outer scales, inner counter-translates */
        .mz3-zo {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .mz3-zi {
          position: absolute;
          inset: 0;
          will-change: transform;
        }
        #mz3-map {
          position: absolute;
          top: 0;
          left: 0;
          width: 400px; /* 1080w source at 0.3704 — top-anchored crop, never stretched */
          display: block;
        }

        /* ── Scene 1 centered lockup ── */
        .mz3-intro-wrap {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 896px; /* content region above the caption keep-out */
          display: grid;
          place-items: center;
          z-index: 3;
          pointer-events: none;
        }
        .mz3-intro {
          display: flex;
          flex-direction: column;
          align-items: center;
          will-change: transform, opacity;
        }
        .mz3-eyebrow {
          font: 400 15px/1 "Space Mono", monospace;
          letter-spacing: 3.5px;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62);
          will-change: transform, opacity;
        }
        .mz3-intro .mz3-eyebrow {
          margin-bottom: 28px;
        }
        .mz3-intro-mark {
          font-family: "Audiowide", sans-serif;
          font-weight: 400;
          font-size: 152px;
          line-height: 1.06;
          letter-spacing: 6px;
          color: #ffffff;
          will-change: transform, opacity;
        }

        /* ── Scene 2 left-column lockup (40% column) ── */
        .mz3-col {
          position: absolute;
          left: 134px;
          top: 252px;
          width: 520px;
          z-index: 4; /* incoming sits above outgoing (scale-swap rule) */
          will-change: transform, opacity;
        }
        .mz3-col .mz3-eyebrow {
          margin-bottom: 20px;
        }
        .mz3-col-mark {
          font-family: "Audiowide", sans-serif;
          font-weight: 400;
          font-size: 112px;
          line-height: 1.1;
          letter-spacing: 4px;
          color: #ffffff;
        }
        .mz3-rule {
          width: 340px;
          height: 1px;
          background: rgba(255, 255, 255, 0.1);
          margin: 30px 0 28px;
          transform-origin: 0 50%;
          will-change: transform;
        }
        .mz3-tagline {
          width: 350px; /* wraps naturally after "cover" — no forced line break */
          font: 400 26px/1.55 "Space Mono", monospace;
          color: rgba(255, 255, 255, 0.62);
          will-change: transform, opacity;
        }
        .mz3-solana {
          margin-top: 12px;
          font: 400 26px/1.55 "Space Mono", monospace;
          color: rgba(255, 255, 255, 0.62);
          will-change: transform, opacity;
        }
        .mz3-kw {
          display: inline-block;
          transform-origin: 50% 50%;
          color: rgb(163, 163, 171); /* matches envelope rest state */
          will-change: transform, color;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-meet-zorr"
        data-width="1920"
        data-height="1080"
        data-duration="4.916"
      >
        <div class="clip mz3-bg" data-start="0" data-duration="4.416" data-track-index="0"></div>

        <div class="clip mz3-stage" data-start="0" data-duration="4.416" data-track-index="1">
          <div class="mz3-ring" id="mz3-ring"></div>

          <div class="mz3-phone" id="mz3-phone">
            <div class="mz3-screen">
              <div class="mz3-zo" id="mz3-zo">
                <div class="mz3-zi" id="mz3-zi">
                  <img id="mz3-map" src="assets/map-empires.png" alt="Zorr empire map — glowing rival territories over Hyderabad" />
                </div>
              </div>
            </div>
          </div>

          <div class="mz3-intro-wrap">
            <div class="mz3-intro" id="mz3-intro">
              <div class="mz3-eyebrow" id="mz3-intro-eyebrow">Solana &times; MagicBlock</div>
              <div class="mz3-intro-mark" id="mz3-intro-mark">ZORR</div>
            </div>
          </div>

          <div class="mz3-col" id="mz3-col">
            <div class="mz3-eyebrow">Solana &times; MagicBlock</div>
            <div class="mz3-col-mark">ZORR</div>
            <div class="mz3-rule" id="mz3-rule"></div>
            <!-- tagline text is specified verbatim by the storyboard Scene 3 block -->
            <div class="mz3-tagline" id="mz3-tagline">the ground you cover becomes yours.</div>
            <div class="mz3-solana" id="mz3-solana">on <span class="mz3-kw" id="mz3-kw">Solana</span>.</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* ── Scene 1 (0.0–0.98) — "Meet Zorr." ─────────────────────────────
             spring-pop entrance, smooth long-tail settle (power3.out, no overshoot) */
          tl.fromTo(
            "#mz3-ring",
            { opacity: 0 },
            { opacity: 1, duration: 0.9, ease: "power2.out" },
            0.05
          );
          tl.fromTo(
            "#mz3-intro-mark",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
            0.05
          );
          tl.fromTo(
            "#mz3-intro-eyebrow",
            { y: 12, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
            0.3
          );

          /* ── Scene 2 (0.98–2.32) — "Run — and the ground you cover" ────────
             scale-swap handoff: outgoing shrinks + drifts left (power2.in),
             incoming column lockup lands on the same leftward path with a
             0.14s overlap; settle is power3.out (house style: no overshoot). */
          tl.to(
            "#mz3-intro",
            { scale: 0.74, x: -150, opacity: 0, duration: 0.32, ease: "power2.in" },
            0.98
          );
          tl.fromTo(
            "#mz3-col",
            { scale: 0.85, x: 90, opacity: 0 },
            { scale: 1, x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            1.16
          );

          /* phone-framed empire map rises from the lower edge (partial travel + fade) */
          tl.fromTo(
            "#mz3-phone",
            { y: 520 },
            { y: 0, duration: 1.05, ease: "power3.out" },
            1.1
          );
          tl.fromTo(
            "#mz3-phone",
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power1.out" },
            1.1
          );

          /* hairline draws, tagline reveals on "you cover" → "becomes" */
          tl.fromTo(
            "#mz3-rule",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.inOut" },
            1.75
          );
          tl.fromTo(
            "#mz3-tagline",
            { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            2.05
          );

          /* ── Scene 3 (2.32–4.416) — "becomes yours." → "On Solana." ────────
             coordinate-target-zoom into the emerald player territory.
             Target in image coords (540,1100 of 1080x2400) → at 400px display
             width: (200, 407.4). Mask center (200, 400) → offset (0, +7.4),
             counter-translate T = -offset = (0, -7). Fixed-pixel geometry, so
             the offset is baked — no measurement needed. Outer scales, inner
             translates; both share duration + ease. Phone unit pushes 1.06
             (the blueprint's guided-attention camera, cursor replaced by push). */
          tl.to(
            "#mz3-zo",
            { scale: 1.38, duration: 1.25, ease: "power3.inOut" },
            2.35
          );
          tl.to(
            "#mz3-zi",
            { x: 0, y: -7, duration: 1.25, ease: "power3.inOut" },
            2.35
          );
          tl.to(
            "#mz3-phone",
            { scale: 1.06, duration: 1.25, ease: "power3.inOut" },
            2.35
          );

          /* "on Solana." line lands just before the spoken cue */
          tl.fromTo(
            "#mz3-solana",
            { y: 14, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
            3.3
          );

          /* asr-keyword-glow: attack/sustain/release envelope on "Solana",
             driven by a single linear driver — pure function of driver.t,
             deterministic under seek. Word spoken 3.70–4.28; frame ends lit. */
          var kwEl = document.getElementById("mz3-kw");
          var KW_START = 3.7;
          var KW_END = 4.25;
          var ATTACK = 0.18;
          var RELEASE = 0.35;
          var REST_LEVEL = 0.35;
          var MAX_BLUR = 24;
          var MAX_SCALE_BOOST = 0.07;
          function mz3Env(t) {
            if (t < KW_START) return 0;
            if (t < KW_END) return Math.min((t - KW_START) / ATTACK, 1);
            var d = (t - KW_END) / RELEASE;
            if (d < 1) return 1 - d * (1 - REST_LEVEL);
            return REST_LEVEL;
          }
          function mz3Lerp(a, b, t) {
            return Math.round(a + (b - a) * t);
          }
          var mzDrv = { t: 0 };
          tl.to(
            mzDrv,
            {
              t: 4.416,
              duration: 4.416,
              ease: "none",
              onUpdate: function () {
                var env = mz3Env(mzDrv.t);
                kwEl.style.textShadow =
                  "0 0 " + MAX_BLUR * env + "px rgba(124,58,237," + 0.9 * env + ")";
                kwEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
                kwEl.style.color =
                  "rgb(" +
                  mz3Lerp(163, 171, env) +
                  "," +
                  mz3Lerp(163, 134, env) +
                  "," +
                  mz3Lerp(171, 255, env) +
                  ")";
              },
            },
            0
          );

          window.__timelines["03-meet-zorr"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
