<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata only; the runtime clones <template> contents. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Audiowide";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Audiowide-Regular.ttf") format("truetype");
        }
        @font-face {
          font-family: "Space Mono";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/SpaceMono-Regular.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Space Mono", monospace;
        }

        /* ── full-bleed ground (clip layer, never on #root) ─────────── */
        .vrf5-bg {
          position: absolute;
          inset: 0;
          background: #05050b;
        }
        .vrf5-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* ── compass geo-ring (atmosphere, 1 per frame — behind phone) ─ */
        .vrf5-ring {
          position: absolute;
          left: 1256px;
          top: 190px;
          width: 560px;
          height: 560px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          opacity: 0.45;
          pointer-events: none;
        }
        .vrf5-ring::before {
          content: "";
          position: absolute;
          inset: 13%;
          border: 1px dashed rgba(255, 255, 255, 0.1);
          border-radius: 50%;
        }

        /* one glow bloom per frame — faint accent halo behind the phone,
           centered on the NFT-card region (post-zoom card y ≈ 486) */
        .vrf5-glow {
          position: absolute;
          left: 1276px;
          top: 226px;
          width: 520px;
          height: 520px;
          background: radial-gradient(
            closest-side,
            rgba(124, 58, 237, 0.5),
            rgba(124, 58, 237, 0) 72%
          );
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* ── phone-framed hero (right 40% — mirror of frame 4) ───────── */
        .vrf5-phone {
          position: absolute;
          left: 1356px;
          top: 96px;
          width: 360px;
          height: 780px;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background: #0a0a0f;
          overflow: hidden; /* zoom-to-target pushes the shot past the mask */
          filter: url(#vrf5-streak);
          will-change: transform, filter;
        }
        /* coordinate-target-zoom: OUTER scales, INNER counter-translates */
        .vrf5-zo {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .vrf5-zi {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          will-change: transform;
        }
        .vrf5-shot {
          display: block;
          width: 100%;
          height: auto; /* portrait 1080x2400 — top-anchored crop, never stretched */
        }

        /* ── typographic VRF rail (left 60%) ─────────────────────────── */
        .vrf5-rail {
          position: absolute;
          left: 134px;
          top: 0;
          width: 936px;
          height: 896px;
        }
        .vrf5-label {
          position: absolute;
          top: 126px;
          left: 0;
          font-family: "Space Mono", monospace;
          font-weight: 400;
          font-size: 14px;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62);
          line-height: 1;
          will-change: transform, opacity;
        }
        .vrf5-rule {
          position: absolute;
          left: 0;
          right: 0;
          height: 1px;
          background: rgba(255, 255, 255, 0.1);
          transform-origin: 0 50%;
          will-change: transform;
        }
        .vrf5-ruletop {
          top: 168px;
        }
        .vrf5-sep1 {
          top: 470px;
        }

        /* value-scaled counter — 1→48 grows in place (bottom-anchored) */
        .vrf5-cntrow {
          position: absolute;
          top: 208px;
          left: 0;
          right: 0;
          height: 150px;
          display: flex;
          align-items: flex-end;
          gap: 24px;
        }
        .vrf5-num {
          font-family: "Audiowide", sans-serif;
          font-weight: 400;
          font-size: 58px; /* animated 58 → 118 by GSAP */
          line-height: 1;
          color: #ffffff;
          font-variant-numeric: tabular-nums;
          width: 240px; /* fixed box — no layout shift as digits grow */
          flex: 0 0 auto;
          will-change: transform, opacity;
        }
        .vrf5-cntlabel {
          font-family: "Space Mono", monospace;
          font-weight: 400;
          font-size: 15px;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62);
          line-height: 1;
          padding-bottom: 10px;
          will-change: transform, opacity;
        }

        /* micro metadata line — reveals under the counter on "art on Arweave" */
        .vrf5-meta {
          position: absolute;
          top: 396px;
          left: 0;
          font-family: "Space Mono", monospace;
          font-weight: 400;
          font-size: 12px;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62);
          line-height: 1;
          will-change: transform, opacity;
        }

        /* rail station — request → oracle callback ~700ms */
        .vrf5-strow {
          position: absolute;
          top: 508px;
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          gap: 24px;
        }
        .vrf5-word {
          font-family: "Audiowide", sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.1;
          color: #ffffff;
          will-change: transform, opacity;
        }
        .vrf5-arrow {
          display: flex;
          align-items: center;
          flex: 0 0 auto;
          will-change: transform, opacity;
        }
        .vrf5-strow2 {
          position: absolute;
          top: 592px;
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          gap: 28px;
        }
        .vrf5-chip {
          flex: 0 0 auto;
          width: 170px;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 13px 0;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background: rgba(255, 255, 255, 0.04);
          will-change: transform, opacity;
        }
        .vrf5-ms {
          font-family: "Space Mono", monospace;
          font-weight: 400;
          font-size: 15px;
          letter-spacing: 1px;
          line-height: 1;
          color: #ffffff;
          font-variant-numeric: tabular-nums;
        }
        /* the keyword — only accent text in the frame; ASR glow envelope */
        .vrf5-fair {
          display: inline-block;
          font-family: "Space Mono", monospace;
          font-weight: 400;
          font-size: 15px;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #7c3aed;
          line-height: 1;
          text-shadow: 0 0 0 rgba(124, 58, 237, 0);
          transform-origin: 0 50%;
          will-change: transform, opacity, text-shadow;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-vrf-guardians"
        data-width="1920"
        data-height="1080"
        data-duration="8.884"
      >
        <div
          id="vrf5-bg"
          class="clip vrf5-bg"
          data-start="0"
          data-duration="8.384"
          data-track-index="0"
        ></div>

        <div
          id="vrf5-stage"
          class="clip vrf5-stage"
          data-start="0"
          data-duration="8.384"
          data-track-index="1"
        >
          <!-- directional motion-blur filter (vertical streak, tweened via proxy) -->
          <svg width="0" height="0" aria-hidden="true" style="position: absolute">
            <defs>
              <filter id="vrf5-streak" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur id="vrf5-blur" in="SourceGraphic" stdDeviation="0 0" />
              </filter>
            </defs>
          </svg>

          <div class="vrf5-ring" id="vrf5-ring"></div>
          <div class="vrf5-glow" id="vrf5-glow"></div>

          <div class="vrf5-phone" id="vrf5-phone" data-layout-allow-overflow>
            <div class="vrf5-zo" id="vrf5-zo">
              <div class="vrf5-zi" id="vrf5-zi" data-layout-allow-overflow>
                <img class="vrf5-shot" src="assets/genesis-claim.png" alt="" />
              </div>
            </div>
          </div>

          <div class="vrf5-rail">
            <div class="vrf5-label" id="vrf5-label">MAGICBLOCK &middot; VRF</div>

            <div class="vrf5-rule vrf5-ruletop" id="vrf5-ruletop"></div>

            <div class="vrf5-cntrow">
              <span class="vrf5-num vrf5-c1" id="vrf5-num">1</span>
              <span class="vrf5-cntlabel vrf5-c1">GENESIS NFTS</span>
            </div>

            <div class="vrf5-meta" id="vrf5-meta">METAPLEX CORE &middot; ART ON ARWEAVE</div>

            <div class="vrf5-rule vrf5-sep1" id="vrf5-sep1"></div>

            <div class="vrf5-strow">
              <span class="vrf5-word vrf5-s1">request</span>
              <span class="vrf5-arrow vrf5-s1" aria-hidden="true">
                <svg width="48" height="22" viewBox="0 0 48 22" fill="none">
                  <line
                    x1="2"
                    y1="11"
                    x2="44"
                    y2="11"
                    stroke="rgba(255,255,255,0.55)"
                    stroke-width="2"
                  />
                  <polyline
                    points="35 3, 44 11, 35 19"
                    stroke="rgba(255,255,255,0.55)"
                    stroke-width="2"
                    fill="none"
                  />
                </svg>
              </span>
              <span class="vrf5-word vrf5-s1">oracle callback</span>
            </div>

            <div class="vrf5-strow2">
              <div class="vrf5-chip vrf5-s2" id="vrf5-chip">
                <span class="vrf5-ms">~700 ms</span>
              </div>
              <span class="vrf5-fair vrf5-s2" id="vrf5-fair">PROVABLY FAIR</span>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var D = 8.384; // synced VO duration — authoritative
          var tl = gsap.timeline({ paused: true });

          var phone = document.getElementById("vrf5-phone");
          var zo = document.getElementById("vrf5-zo");
          var zi = document.getElementById("vrf5-zi");
          var ring = document.getElementById("vrf5-ring");
          var glow = document.getElementById("vrf5-glow");
          var label = document.getElementById("vrf5-label");
          var ruleTop = document.getElementById("vrf5-ruletop");
          var sep1 = document.getElementById("vrf5-sep1");
          var numEl = document.getElementById("vrf5-num");
          var meta = document.getElementById("vrf5-meta");
          var chip = document.getElementById("vrf5-chip");
          var fair = document.getElementById("vrf5-fair");

          /* ── base states at build (elements live in the always-mounted stage clip;
                 later reveals must be hidden from frame 0 on any seek) ── */
          gsap.set(phone, { y: 620, opacity: 0 });
          gsap.set(ring, { opacity: 0 });
          gsap.set(glow, { opacity: 0, scale: 0.86 });
          gsap.set(label, { opacity: 0, y: 16 });
          gsap.set([ruleTop, sep1], { scaleX: 0 });
          gsap.set(".vrf5-c1", { opacity: 0, y: 26 });
          gsap.set(meta, { opacity: 0, y: 14 });
          gsap.set(".vrf5-s1", { opacity: 0, y: 26 });
          gsap.set(".vrf5-s2", { opacity: 0, y: 22 });

          /* ── Scene 1 (0 – 2.10s) · phone streaks up right, zoom-to-target on
                 "Claim a Guardian" pushes toward the Molten Panther card ── */

          // motion-blur streak (rule: motion-blur-streak, Path A vertical):
          // blur proxy seeded so a seek to t=0 shows the streaked start
          var blurNode = document.getElementById("vrf5-blur");
          var blurProxy = { v: 18 };
          var writeBlur = function () {
            blurNode.setAttribute("stdDeviation", "0 " + blurProxy.v);
          };
          writeBlur();

          tl.fromTo(phone, { y: 620 }, { y: 0, duration: 0.68, ease: "power4.out" }, 0.06);
          tl.fromTo(
            phone,
            { opacity: 0 },
            { opacity: 1, duration: 0.26, ease: "power1.out" },
            0.06
          );
          // blur envelope locked to the same window + ease → peak blur at peak speed
          tl.to(
            blurProxy,
            { v: 0, duration: 0.68, ease: "power4.out", onUpdate: writeBlur },
            0.06
          );

          tl.fromTo(ring, { opacity: 0 }, { opacity: 0.45, duration: 0.9, ease: "power2.out" }, 0.15);

          // coordinate-target-zoom (rule): outer scales, inner counter-translates,
          // SAME window + ease. Card center in the 360x800 scaled shot = (96, 486);
          // window center (180, 390) → offset (-84, +96) → T = -offset, x clamped
          // to +44 so the shot covers the 360px mask at every tween progress.
          tl.fromTo(
            zo,
            { scale: 1 },
            { scale: 1.35, duration: 1.2, ease: "power3.inOut" },
            1.0
          );
          tl.fromTo(
            zi,
            { x: 0, y: 0 },
            { x: 44, y: -96, duration: 1.2, ease: "power3.inOut" },
            1.0
          );

          // macro camera move under the whole shot: slow push-in on the phone hero
          tl.fromTo(phone, { scale: 1 }, { scale: 1.025, duration: D - 1.35, ease: "none" }, 1.35);

          /* ── Scene 2 (2.10 – 5.66s) · rail builds one station per spoken cue ── */

          // "MagicBlock VRF" (~2.0–3.0) → label reveals above the left column
          tl.fromTo(
            label,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            2.15
          );
          tl.fromTo(ruleTop, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 2.25);

          // "forty-eight" (~3.6) → value-scaled counter counts 1→48
          // (rule: counting-dynamic-scale — value + font-size in ONE tween, power3.out)
          tl.fromTo(
            ".vrf5-c1",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 },
            3.62
          );
          var cnt = { v: 1, fs: 58 };
          tl.to(
            cnt,
            {
              v: 48,
              fs: 118,
              duration: 1.45,
              ease: "power3.out",
              onUpdate: function () {
                numEl.textContent = String(Math.round(cnt.v));
                numEl.style.fontSize = cnt.fs + "px";
              },
            },
            3.72
          );

          // "provably fair" (~5.0–5.9) → station reveals over a hairline
          tl.fromTo(sep1, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.05);
          tl.fromTo(
            ".vrf5-s1",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 },
            5.18
          );
          tl.fromTo(
            ".vrf5-s2",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.1 },
            5.32
          );

          // keyword glow (rule: asr-keyword-glow) — accent envelope on the
          // keyword ONLY: attack 0.2 → sustain → release to a faint rest level.
          // Scale is written via gsap.set so it merges with the reveal's y tween.
          var GS = 5.45,
            GE = 6.15,
            ATK = 0.2,
            REL = 0.45,
            REST = 0.25;
          var envAt = function (t) {
            if (t < GS) return 0;
            if (t < GS + ATK) return (t - GS) / ATK;
            if (t < GE) return 1;
            if (t < GE + REL) return 1 - ((t - GE) / REL) * (1 - REST);
            return REST;
          };
          var drv = { t: 5.3 };
          tl.to(
            drv,
            {
              t: D,
              duration: D - 5.3,
              ease: "none",
              onUpdate: function () {
                var env = envAt(drv.t);
                fair.style.textShadow =
                  "0 0 " + (22 * env).toFixed(2) + "px rgba(124, 58, 237, " +
                  (0.3 + 0.45 * env).toFixed(3) + ")";
                gsap.set(fair, { scale: 1 + 0.07 * env });
              },
            },
            5.3
          );

          /* ── Scene 3 (5.66 – 8.384s) · Arweave metadata line, one faint bloom
                 behind the phone's NFT card, then held read ── */

          // "art on Arweave" (~6.4–7.5) → micro line reveals under the counter
          tl.fromTo(
            meta,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            6.6
          );

          // one glow bloom per frame — bloom once behind the card, settle low
          // (rule: ambient-glow-bloom, pulse-on-arrival variant)
          tl.fromTo(
            glow,
            { opacity: 0, scale: 0.86 },
            { opacity: 0.3, scale: 1, duration: 0.75, ease: "power2.out" },
            6.8
          );
          tl.to(glow, { opacity: 0.16, duration: 0.6, ease: "power2.inOut" }, 7.7);

          // held read: subtle jitter only on the ~700ms chip (bounded, zero at onset)
          var jit = { p: 0 };
          tl.to(
            jit,
            {
              p: 12,
              duration: D - 6.9,
              ease: "none",
              onUpdate: function () {
                gsap.set(chip, {
                  x: Math.sin(jit.p * 2.8) * 1.1,
                  y: Math.sin(jit.p * 4.1) * 0.8,
                });
              },
            },
            6.9
          );

          window.__timelines["05-vrf-guardians"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
